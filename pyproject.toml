[project]
name = "infoguana"
version = "0.1.0"
description = "Infoguana — cross-project second brain with semantic search and MCP integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "igraph>=0.11",
    "mcp>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# rootdir on sys.path, so `from app import ...` and `from tests.conftest
# import ...` both resolve without an editable install.
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
