[project]
name = "infoguana"
version = "0.2.0"
description = "Infoguana — cross-project second brain with semantic search and MCP integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "igraph>=0.11",
    # Both bounds are load-bearing, and app/mcp_server.py imports from both
    # affected modules at module scope, so either violation fails at boot
    # rather than at install.
    # Lower: `mcp.server.transport_security` does not exist before 1.10, and
    # an environment already holding 1.9.x satisfies a bare `>=1.0`, so pip
    # leaves it in place.
    # Upper: mcp 2.0 removed `mcp.server.fastmcp`, so a bare `<3` resolves a
    # fresh install to 2.x and app.main, app.mcp_server and app.routes.chat
    # all fail to import. Lifting it means porting to the 2.x server API,
    # not just relaxing the pin.
    "mcp>=1.10,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# rootdir on sys.path, so `from app import ...` and `from tests.conftest
# import ...` both resolve without an editable install.
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Seeded skill bodies are SKILL.md documents on disk, not string literals,
# and app/skill_seeds/ is a data directory rather than a package — without
# this an installed wheel boots with an empty skill manifest.
[tool.setuptools.package-data]
app = ["skill_seeds/*.md"]
