services:
  infoguana:
    build: .
    # Names the image `build:` produces. Without it compose derives a name
    # from the project directory, so a separately-built image (CI builds one
    # with the layer cache) is ignored and `up` silently rebuilds its own.
    image: infoguana:latest
    container_name: infoguana
    restart: unless-stopped
    ports:
      - "${INFOGUANA_PORT:-8789}:8789"
    # Every setting below has a default. Drop overrides into .env to change
    # them — the env_file directive below loads it into the container.
    # Short form on purpose: the `path:`/`required:` long form needs Compose
    # v2.24+, and older Compose rejects the whole file rather than degrading.
    # The cost is that .env must exist; `cp .env.example .env` covers it, and
    # both README and DEPLOY.md name that as a setup step.
    env_file:
      - .env
    environment:
      INFOGUANA_HOST: ${INFOGUANA_HOST:-0.0.0.0}
      # Fixed, not ${INFOGUANA_PORT}: that variable is the HOST side of the
      # ports mapping above, whose container side and the healthcheck below
      # are both 8789. Substituting it here moved the listener without moving
      # them, so any value but the default published a port nothing served.
      INFOGUANA_PORT: 8789
      INFOGUANA_DB_PATH: ${INFOGUANA_DB_PATH:-/data/infoguana.db}
      INFOGUANA_BACKUP_DIR: ${INFOGUANA_BACKUP_DIR:-/backups}
      INFOGUANA_CLAUDE_BIN: ${INFOGUANA_CLAUDE_BIN:-claude}
      INFOGUANA_CLASSIFY_MODEL: ${INFOGUANA_CLASSIFY_MODEL:-claude-haiku-4-5}
      INFOGUANA_EMBED_MODEL: ${INFOGUANA_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      # Empty → the read-only filesystem tools are off. Set to a colon-separated
      # list of absolute roots (paths as seen inside the container) to enable.
      INFOGUANA_FS_ALLOWLIST: ${INFOGUANA_FS_ALLOWLIST:-}
      # Empty → no Host/Origin checks. Set when clients reach the server by a
      # LAN or tailnet name rather than localhost.
      INFOGUANA_MCP_ALLOWED_HOSTS: ${INFOGUANA_MCP_ALLOWED_HOSTS:-}
      # Empty → entrypoint generates one and persists it to /data/.mcp_secret.
      INFOGUANA_MCP_SECRET: ${INFOGUANA_MCP_SECRET:-}
      # GitHub integration is optional; chat features degrade gracefully if unset.
      # Set INFOGUANA_GITHUB_READ_TOKEN and/or INFOGUANA_GITHUB_BOT_TOKENS in .env.
      INFOGUANA_GITHUB_READ_TOKEN: ${INFOGUANA_GITHUB_READ_TOKEN:-}
      # Bind-mounted files (./data, ./backups, ./claude-config) get chowned to
      # this UID:GID on every entrypoint run so the host user can read/edit them
      # without sudo. Default 1000:1000 = first user on most Linux distros.
      # Linux users on a different UID should set in .env or shell:
      #   PUID=$(id -u) PGID=$(id -g) docker compose up -d
      # Docker Desktop on Windows/macOS virtualizes ownership, so leave as default.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./data:/data
      - ./backups:/backups
      # Persistent claude CLI auth. Auth once via:
      #   docker compose exec infoguana claude /login
      - ./claude-config:/claude-config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8789/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
