        // Re-center and zoom on the clicked node before opening the
        // panel so the synapse connector has a clear, predictable run
        // from the focal node to the panel edge.
        zoomToNode(d, svg.node().clientWidth, svg.node().clientHeight);
        openPanel(d);
      });

    nodeSel.each(function(d) {
      const g = d3.select(this);
      const r = nodeRadius(d);
      const shape = nodeShape(d);
      // Hidden bg-colored backdrop (matches body bg-slate-950 #020617).
      // Always first in the group so subsequent shapes paint on top of
      // it. Mirrors the visible shape geometry exactly so the occluded
      // region matches the silhouette — a circle blocker behind a
      // diamond reads as a weird halo.
      const bf = '#020617';
      if (shape === 'diamond') {
        const h = r * 0.8 * Math.SQRT2;
        g.append('path')
          .attr('class', 'node-blocker')
          .attr('d', `M0,${-h}L${h},0L0,${h}L${-h},0Z`)
          .attr('fill', bf);
      } else if (shape === 'triangle') {
        const a = r * 0.866;
        g.append('path')
          .attr('class', 'node-blocker')
          .attr('d', `M0,${-r}L${a},${r * 0.5}L${-a},${r * 0.5}Z`)
          .attr('fill', bf);
      } else {
        g.append('circle')
          .attr('class', 'node-blocker')
          .attr('r', r)
          .attr('fill', bf);
      }
      if (d.kind === 'project') {
        const h = r * 0.8 * Math.SQRT2;
        g.append('path')
          .attr('class','node-shape')
          .attr('d', `M0,${-h}L${h},0L0,${h}L${-h},0Z`)
          .attr('fill', nodeColor(d))
          .attr('stroke', '#0f172a').attr('stroke-width', 1.5);
        g.append('text').attr('class','node-label')
          .attr('y', r + 12).attr('text-anchor','middle').text(d.name);
      } else if (d.kind === 'tag') {
        // Small unlabeled dots — names live in the tooltip + side panel.
        g.append('circle')
          .attr('class','node-shape')
          .attr('r', r)
          .attr('fill', nodeColor(d))
          .attr('stroke', '#0f172a').attr('stroke-width', 1)
          .attr('fill-opacity', 0.7);
      } else if (shape === 'diamond') {
        const h = r * 0.8 * Math.SQRT2;
        g.append('path')
          .attr('class','node-shape')
          .attr('d', `M0,${-h}L${h},0L0,${h}L${-h},0Z`)
          .attr('fill', nodeColor(d))
          .attr('stroke', '#0f172a').attr('stroke-width', 1.5);
      } else if (shape === 'triangle') {
        // Equilateral, point-up — reads as "intent / aiming forward".
        // sqrt(3)/2 ≈ 0.866 so vertices land at distance r from origin.
        const a = r * 0.866;
        g.append('path')
          .attr('class','node-shape')
          .attr('d', `M0,${-r}L${a},${r * 0.5}L${-a},${r * 0.5}Z`)
          .attr('fill', nodeColor(d))
          .attr('stroke', '#0f172a').attr('stroke-width', 1.5);
      } else {
        g.append('circle')
          .attr('class','node-shape')
          .attr('r', r)
          .attr('fill', nodeColor(d))
          .attr('stroke', '#0f172a').attr('stroke-width', 1.5);
      }
    });

    // Promote project labels to render on top of every other node and edge.
    nodeSel.filter(d => d.kind === 'project').raise();

    // Halos render above all nodes — selecting a busy node otherwise
    // gets its rings clipped by the surrounding cluster. Drawn last
    // (= painted last) and pointer-events:none so clicks still hit the
    // underlying node, not the halo.
    haloLayer = zoomG.append('g')
      .attr('class', 'halo-layer')
      .attr('pointer-events', 'none');
    // Separate layer for transient hover halos (project preview list)
    // so they don't get cleared by selection-halo redraws and vice versa.
    hoverHaloLayer = zoomG.append('g')
      .attr('class', 'hover-halo-layer')
      .attr('pointer-events', 'none');

    // Project name labels live in their own top-most layer so they
    // paint over halos, hover-auras, and every other graph element —
    // names are the only way to identify a project at a glance, so they
    // can't be obscured. Mirrors the position of the in-group label
    // (y = node center + r + 12) and the same .node-label styling.
    const projectLabelLayer = zoomG.append('g')
      .attr('class', 'project-label-layer')
      .attr('pointer-events', 'none');
    for (const n of nodes) {
      if (n.kind !== 'project') continue;
      projectLabelLayer.append('text')
        .attr('class', 'node-label project-label')
        .attr('data-node-id', n.id)
        .attr('x', n.x)
        .attr('y', n.y + nodeRadius(n) + 12)
        .attr('text-anchor', 'middle')
        .text(n.name);
    }
    // Strip the duplicate label that lives inside each project node
    // group — leaving it would render the name twice (once dim under
    // halos, once bright on top) and shimmer when the dim toggles.
    nodeSel.filter(d => d.kind === 'project').selectAll('text.node-label').remove();

    buildLegend(nodes);
    applyFilter();
    zoomToFit(nodes.filter(n => !isHidden(n)), width, height);

    // ?focus=<id> — landed here from a "view in graph" action or by
    // refreshing the page on a focused selection. The value is a
    // namespaced node id ("note:42", "project:infoguana", "tag:docker"); a
    // bare number is treated as a note id for backwards compatibility
    // with older links.
    const focusParam = new URLSearchParams(location.search).get('focus');
    if (focusParam) {
      const focusId = focusParam.includes(':') ? focusParam : ('note:' + focusParam);
      const focusNode = nodeById.get(focusId);
      if (focusNode) {
        zoomToNode(focusNode, width, height);
        openPanel(focusNode);
      }
    }
  }

  function zoomToNode(n, width, height, scale = 1.6) {
    if (!zoomBehavior) return;
    const tx = width / 2 - scale * n.x;
    const ty = height / 2 - scale * n.y;
    svg.transition().duration(500).call(
      zoomBehavior.transform,
      d3.zoomIdentity.translate(tx, ty).scale(scale),
    );
  }

  function zoomToFit(nodes, width, height, padding = 40, duration = 0) {
    if (!nodes.length || !zoomBehavior) return;
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = maxX - minX || 1, h = maxY - minY || 1;
    const scale = Math.min(
      (width - padding * 2) / w,
      (height - padding * 2) / h,
      4,
    );
    const tx = width / 2 - scale * (minX + maxX) / 2;
    const ty = height / 2 - scale * (minY + maxY) / 2;
    const target = d3.zoomIdentity.translate(tx, ty).scale(scale);
    if (duration > 0) {
      svg.transition().duration(duration).call(zoomBehavior.transform, target);
    } else {
      svg.call(zoomBehavior.transform, target);
    }
  }

  // Panel position depends on viewport size — keep the connector
  // anchored to the panel's left edge as the window resizes.
  window.addEventListener('resize', updateConnector);

  fetch('/graph.json')
    .then(r => r.json())
    .then(render)
    .catch(e => {
      svg.append('text').attr('x', '50%').attr('y', '50%').attr('text-anchor','middle')
        .attr('fill','#ef4444').text('failed to load graph: ' + e.message);
    });

</script>
{% endblock %}
